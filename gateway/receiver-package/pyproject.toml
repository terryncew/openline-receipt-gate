[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-receiver"
version = "0.1.0"
description = "Minimal OpenLine receiver: verify owner-signed mandates, enforce decisions, emit signed receipts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["."]
include = ["openline_receiver*"]
