# Envoy configuration for the Docker Compose profile (openline).
#
# Identical to ../envoy/envoy-openline.yaml EXCEPT the upstreams: inside
# Compose the services are reachable by service name (authz, mockapi),
# NOT by 127.0.0.1 — each container has its own loopback, so the
# host-mode config's 127.0.0.1 endpoints would make Envoy talk to
# itself. Hostnames require STRICT_DNS clusters (STATIC only accepts
# literal IPs — Envoy exits critical otherwise).
#
# The canonical host-mode file is untouched so ./up.sh keeps working.

admin:
  address:
    socket_address: {address: 127.0.0.1, port_value: 9901}

static_resources:
  listeners:
  - name: ingress
    address:
      socket_address: {address: 0.0.0.0, port_value: 8080}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: gateway
              domains: ["*"]
              routes:
              - match: {prefix: "/api/"}
                route: {cluster: mock_api, prefix_rewrite: "/"}
              - match: {path: "/health"}
                direct_response: {status: 200, body: {inline_string: "ok"}}
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
          http_filters:
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              failure_mode_allow: false
              grpc_service:
                envoy_grpc:
                  cluster_name: authz_cluster
                timeout: 2s
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: authz_cluster
    connect_timeout: 1s
    type: STRICT_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: authz_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: {address: authz, port_value: 50051}
  - name: mock_api
    connect_timeout: 1s
    type: STRICT_DNS
    load_assignment:
      cluster_name: mock_api
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: {address: mockapi, port_value: 9000}
