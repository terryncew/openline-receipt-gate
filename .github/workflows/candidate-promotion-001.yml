name: candidate-promotion-001

on:
  push:
    branches: [main, 'feat/cpg-*']
  pull_request:

jobs:
  cpg001:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install "setuptools==82.0.1" "wheel==0.47.0" pytest
      - run: python -m pip install --no-build-isolation .
      - run: pytest -q tests/test_candidate_promotion.py tests/test_candidate_promotion_jain_design.py tests/test_candidate_promotion_jain_preflight.py
      - run: |
          python benchmarks/candidate_promotion/verify_jain_design_lock.py > /tmp/jain-design-lock.json
          diff -u benchmarks/candidate_promotion/JAIN_2017_DESIGN_VERIFICATION.json /tmp/jain-design-lock.json
      - run: python benchmarks/candidate_promotion/verify_jain_preflight_contract.py
      - run: python benchmarks/candidate_promotion/run_replay.py --out /tmp/cpg001.json
      - run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/cpg001.json'))
          assert r['control']['masked_declared_liabilities_promoted'] >= 1
          assert r['treatment']['masked_declared_liabilities_promoted'] == 0
          assert r['treatment']['top_k_fill_rate'] == 1.0
          assert r['treatment']['heldout_assay_pass_rate'] >= r['control']['heldout_assay_pass_rate']
          PY
