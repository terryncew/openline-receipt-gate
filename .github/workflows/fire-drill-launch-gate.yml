name: Fire Drill fresh clone test
on:
  pull_request:
    branches: [main]
    paths: ['examples/fire_drill_001/**','.github/workflows/fire-drill-launch-gate.yml','README.md']
permissions:
  contents: read
jobs:
  clean-public-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fresh public clone at proposed SHA
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/terryncew/openline-receipt-gate.git "$RUNNER_TEMP/fresh"
          cd "$RUNNER_TEMP/fresh"
          git checkout --detach "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test -f examples/fire_drill_001/run.py
          test ! -f examples/independent_receiver_kit/native_wallet.py
          test ! -f examples/verified_agent_handoff/quickstart.py
      - name: Isolated install, original JWT tests and Fire Drill adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fresh"
          python3 -m venv .venv
          .venv/bin/python -m pip install -e . -r examples/independent_receiver_kit/requirements.txt
          .venv/bin/python -m unittest examples.independent_receiver_kit.test_receiver -v
          .venv/bin/python -m unittest examples.fire_drill_001.tests -v
      - name: Generate and independently verify new evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fresh"
          .venv/bin/python -m examples.fire_drill_001.run --out "$RUNNER_TEMP/drill"
          sum="$(sha256sum "$RUNNER_TEMP/drill/MANIFEST.json" | awk '{print $1}')"
          echo "OUT_OF_BAND_MANIFEST_SHA256=$sum"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/fresh" "$RUNNER_TEMP/fresh/.venv/bin/python" -m examples.fire_drill_001.verify --bundle "$RUNNER_TEMP/drill" --expected-sha256 "$sum" > "$RUNNER_TEMP/verifier.json"
          python3 - "$RUNNER_TEMP/verifier.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['verdict']=='PASS_SCOPED_EVIDENCE',d
          assert d['modes']['intentionally_weak']['protected_unauthorized_effects']==4
          for k in ['conventional','openline']:
              assert d['modes'][k]['protected_unauthorized_effects']==0
              assert d['modes'][k]['protected_denied_old_agent_attempts']==4
              assert d['modes'][k]['outside_receiver_effects']==1
              assert d['modes'][k]['unrelated_slot_effects']==1
          print('FRESH_CLONE_PROTECTED_PARITY_AND_UNGUARDED_BYPASS_PASS')
          PY
          test -s "$RUNNER_TEMP/drill/fire-drill-40s.html"
      - name: Install free browser driver client
        run: python3 -m pip install selenium==4.38.0
      - name: Test live production #proof, Fire Drill links and illustrative guesthouse
        shell: bash
        run: |
          python3 - <<'PY'
          import json,shutil,time,urllib.request,urllib.error
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          print('CHROME_EXECUTABLE',chrome,flush=True)
          assert chrome, 'real_chrome_not_available'
          o=Options()
          o.binary_location=chrome
          for a in ('--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--window-size=1440,900'):
              o.add_argument(a)
          driver=webdriver.Chrome(options=o)
          try:
              url='https://openlineprotocol.org/'
              driver.set_page_load_timeout(45)
              driver.get(url)
              print('LIVE_URL',driver.current_url)
              print('TITLE',driver.title)
              print('PAGE_LENGTH',len(driver.page_source))
              print('FIRST_VISIBLE_TEXT',driver.find_element(By.TAG_NAME,'body').text[:350])
              print('PROOF_TARGET_COUNT',len(driver.find_elements(By.ID,'proof')))
              links=driver.find_elements(By.CSS_SELECTOR,"a[href='#proof']")
              print('PROOF_TRIGGER_COUNT',len(links))
              before=driver.execute_script('return window.scrollY')
              if links:
                  driver.execute_script("arguments[0].click()", links[-1])
                  time.sleep(0.3)
              after=driver.execute_script('return window.scrollY')
              print('AFTER_PROOF_CLICK',json.dumps({'hash':driver.execute_script('return location.hash'),'scroll_before':before,'scroll_after':after,'target_exists':len(driver.find_elements(By.ID,'proof'))>0}))
              assert len(links)>0 and len(driver.find_elements(By.ID,'proof'))>0, 'PROOF_ANCHOR_BROKEN'
              assert driver.execute_script('return location.hash')=='#proof' and after>before,'PROOF_NOT_SCROLLING'
              html=driver.page_source.lower()
              assert '75' in html and ('illustrative' in html or 'simulated' in html),'GUESTHOUSE_CAVEAT_NOT_FOUND'
              assert len(driver.find_elements(By.ID,'model-form'))==1,'CALCULATOR_MISSING'
              checked={}
              hrefs=sorted({a.get_attribute('href') for a in driver.find_elements(By.CSS_SELECTOR,'a[href]') if a.get_attribute('href') and ('fire_drill' in a.get_attribute('href') or '/pull/129' in a.get_attribute('href'))})
              print('FIRE_DRILL_LINKS',json.dumps(hrefs))
              assert any('/VERIFIED-RESULTS.json' in h for h in hrefs),'RESULTS_LINK_MISSING'
              assert any('/verify.py' in h for h in hrefs),'VERIFIER_LINK_MISSING'
              assert any('/README.md' in h for h in hrefs),'QUICKSTART_LINK_MISSING'
              for href in hrefs:
                  try:
                      req=urllib.request.Request(href,headers={'User-Agent':'Mozilla/5.0 OpenLine launch review'})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          checked[href]=response.status
                  except urllib.error.HTTPError as exc:
                      checked[href]=exc.code
                  except Exception as exc:
                      checked[href]=str(exc)
              print('LINK_STATUS',json.dumps(checked,sort_keys=True))
              assert all(x==200 for x in checked.values()),'BROKEN_FIRE_DRILL_LINKS'
              print('BROWSER_PRODUCTION_PASS')
          finally:
              driver.quit()
          PY
