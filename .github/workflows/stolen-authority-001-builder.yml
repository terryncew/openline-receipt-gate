name: STOLEN-AUTHORITY-001 closure

on:
  push:
    branches:
      - main
    paths:
      - "olp_gate/subject_bound_commit.py"
      - "tests/test_stolen_authority_001.py"
      - "STOLEN_AUTHORITY_001_CONTRACT.json"
      - "tools/apply_stolen_authority_001.py"
      - ".github/workflows/stolen-authority-001-builder.yml"
  pull_request:
    paths:
      - "olp_gate/subject_bound_commit.py"
      - "tests/test_stolen_authority_001.py"
      - "STOLEN_AUTHORITY_001_CONTRACT.json"
      - "tools/apply_stolen_authority_001.py"
      - ".github/workflows/stolen-authority-001-builder.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_BASE_SHA: 3ae2918d59125e13cf8f58147e482ebb940b6da6

jobs:
  verify-stolen-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record run identity
        run: |
          mkdir -p "$RUNNER_TEMP/stolen-authority-001"
          printf '%s\n' \
            "head_sha=$GITHUB_SHA" \
            "event=$GITHUB_EVENT_NAME" \
            "ref=$GITHUB_REF" \
            "runner_os=$RUNNER_OS" \
            "runner_arch=$RUNNER_ARCH" \
            > "$RUNNER_TEMP/stolen-authority-001/run-context.txt"
          python --version >> "$RUNNER_TEMP/stolen-authority-001/run-context.txt"

      - name: Prove frozen core remains untouched
        run: |
          python tools/apply_stolen_authority_001.py
          git diff --exit-code "$FROZEN_BASE_SHA" -- \
            olp_gate/verified_commit.py \
            olp_gate/authority_compiler.py \
            olp_gate/tool_adapter.py
          git show "$FROZEN_BASE_SHA:olp_gate/verified_commit.py" | sha256sum
          git show "$FROZEN_BASE_SHA:olp_gate/authority_compiler.py" | sha256sum
          git show "$FROZEN_BASE_SHA:olp_gate/tool_adapter.py" | sha256sum

      - name: Static sanity
        run: |
          python -m compileall -q olp_gate tests/test_stolen_authority_001.py
          git diff --check

      - name: Install package and test runner
        run: python -m pip install . pytest

      - name: Run hostile closure plus historical source-closure sentinels
        shell: bash
        run: |
          set +e
          python -m pytest \
            tests/test_stolen_authority_001.py \
            tests/test_verified_commit.py \
            tests/test_mandate_owner_001.py \
            tests/test_peer_authority_001.py \
            tests/test_temporal_authority_001.py \
            tests/test_x402_freeze.py \
            -q 2>&1 | tee "$RUNNER_TEMP/stolen-authority-001/focused.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/stolen-authority-001/focused.status"
          exit 0

      - name: Run entire downstream regression suite
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/stolen-authority-001/full-suite.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/stolen-authority-001/full-suite.status"
          exit 0

      - name: Verify tests did not mutate frozen core
        if: always()
        run: |
          git diff --exit-code "$FROZEN_BASE_SHA" -- \
            olp_gate/verified_commit.py \
            olp_gate/authority_compiler.py \
            olp_gate/tool_adapter.py

      - name: Freeze CI receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / "stolen-authority-001"
          def status(name):
              path = evidence / name
              return int(path.read_text().strip()) if path.exists() else None

          focused = status("focused.status")
          full = status("full-suite.status")
          passed = focused == 0 and full == 0
          result = {
              "schema": "openline.stolen-authority-001.ci-result.v1",
              "experiment": "STOLEN-AUTHORITY-001",
              "base_sha": "3ae2918d59125e13cf8f58147e482ebb940b6da6",
              "head_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "trigger": os.environ.get("GITHUB_EVENT_NAME"),
              "focused_status": focused,
              "full_suite_status": full,
              "frozen_core_modified": False,
              "supported_runtime_subject_bound": focused == 0,
              "runtime_path": "authorize_subject_bound_owned -> SubjectBoundLocalAuthorityRuntime -> AuthorityCompiler.execute_once -> SubjectBoundCommitGate -> VerifiedCommitLedger",
              "verdict": (
                  "STOLEN_AUTHORITY_CONTAINED_AT_RECEIVER_BOUNDARY"
                  if passed
                  else "UNRESOLVED"
              ),
              "claim_boundary": (
                  "Receiver-controlled subject authentication is assumed; "
                  "same-subject credential compromise is not covered."
              ),
          }
          path = evidence / "STOLEN_AUTHORITY_001_RESULT.json"
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          (evidence / "STOLEN_AUTHORITY_001_RESULT.sha256").write_text(
              f"{digest}  STOLEN_AUTHORITY_001_RESULT.json\n"
          )
          PY

      - name: Capture workspace diagnostics
        if: always()
        shell: bash
        run: |
          git status --short > "$RUNNER_TEMP/stolen-authority-001/git-status.txt"
          git diff --stat "$FROZEN_BASE_SHA"...HEAD > "$RUNNER_TEMP/stolen-authority-001/branch-diff-stat.txt"
          git diff --check > "$RUNNER_TEMP/stolen-authority-001/git-diff-check.txt" 2>&1 || true

      - name: Upload complete STOLEN-AUTHORITY-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stolen-authority-001-evidence
          path: ${{ runner.temp }}/stolen-authority-001/
          if-no-files-found: error
          retention-days: 90

      - name: Require every downstream gate
        shell: bash
        run: |
          test "$(cat "$RUNNER_TEMP/stolen-authority-001/focused.status")" = "0"
          test "$(cat "$RUNNER_TEMP/stolen-authority-001/full-suite.status")" = "0"
