# TEMPORARY: Stall isolation diagnostic workflow
# Branch: temp/stall-isolation-001 ONLY
# Trigger: push (temporary; will be disabled after experiment)
# DO NOT MERGE. Delete after use.

name: TEMP Stall Isolation Diagnostic

on:
  push:
    branches:
      - temp/stall-isolation-001

jobs:
  stall-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          ref: temp/stall-isolation-001
      
      - name: Verify branch
        run: |
          BRANCH=$(git branch --show-current)
          echo "Branch: $BRANCH"
          if [ "$BRANCH" != "temp/stall-isolation-001" ]; then
            echo "ERROR: Wrong branch"
            exit 1
          fi
      
      - name: Run stall diagnostic
        run: |
          chmod +x ./trigger-stall-isolation.sh
          ./trigger-stall-isolation.sh || true
          echo "Diagnostic complete (exit code preserved above)"
      
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stall-diagnostic-${{ github.sha }}
          path: |
            /tmp/stall-results.json
            /tmp/stall-ps.log
            /tmp/stall-envoy.log
            /tmp/stall-authz.log
            /tmp/stall-mockapi.log
            /tmp/stall-envoy-config.yaml
          retention-days: 30
      
      - name: Report verdict
        if: always()
        run: |
          if [ -f /tmp/stall-results.json ]; then
            echo "=== VERDICT ==="
            cat /tmp/stall-results.json
          else
            echo "No results file. Diagnostic failed to complete."
          fi
