name: RGV-P34 Reality Gate Pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/candidate_promotion/experiments/rgv_p34/**"
      - ".github/workflows/rgv-p34.yml"
      - "docs/RGV_P34.md"

permissions:
  contents: read

jobs:
  p34-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDP_REPO: https://github.com/ginkgobioworks/abdev-benchmark.git
      GDP_COMMIT: cc6d3b69afc92695445695345399d9c91b0d14a4
      GDP_PATH: data/GDPa1_v1.2_20250814.csv
      GDP_BLOB: 923c38b1a7b7d2421bd4c6fa7461febc797c446c

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2,<3" "pandas>=2,<3" "scipy>=1.14,<2" "scikit-learn==1.8.0"

      - name: Verify inherited selector freeze and pilot syntax
        run: |
          python benchmarks/trial_selector/external_001/verify_freeze.py
          python -m py_compile benchmarks/candidate_promotion/experiments/rgv_p34/run_suite.py
          python -m benchmarks.candidate_promotion.experiments.rgv_p34.run_suite --self-test

      - name: Fetch exact official GDPa1 source
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/abdev-benchmark"
          git init "$upstream"
          git -C "$upstream" remote add origin "$GDP_REPO"
          git -C "$upstream" fetch --depth=1 origin "$GDP_COMMIT"
          git -C "$upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$upstream" rev-parse HEAD)" = "$GDP_COMMIT"
          test "$(git -C "$upstream" rev-parse "HEAD:$GDP_PATH")" = "$GDP_BLOB"
          printf 'GDP_ROOT=%s\n' "$upstream" >> "$GITHUB_ENV"

      - name: Run exact P34 nested pilot
        run: |
          python -m benchmarks.candidate_promotion.experiments.rgv_p34.run_suite \
            --csv "$GDP_ROOT/$GDP_PATH" \
            --tap "$GDP_ROOT/data/features/processed_features/GDPa1/TAP.csv" \
            --output rgv-p34-report.json

      - name: Verify report contract
        if: always()
        run: |
          test -f rgv-p34-report.json
          python -m benchmarks.candidate_promotion.experiments.rgv_p34.verify_report rgv-p34-report.json

      - name: Publish scientific disposition
        if: always()
        shell: bash
        run: |
          echo '## RGV-P34' >> "$GITHUB_STEP_SUMMARY"
          if test -f rgv-p34-report.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open("rgv-p34-report.json"))
          print(f"**Verdict:** `{r.get('verdict')}`")
          print()
          print(f"**Evidence grade:** `{r.get('evidence_grade')}`")
          if r.get("cohort"):
              print(f"**Cohort:** {r['cohort'].get('candidate_count')} candidates; {r['cohort'].get('clean_count')} clean / {r['cohort'].get('bad_count')} bad")
          if r.get("arms",{}).get("RGV"):
              m=r["arms"]["RGV"]
              print(f"**RGV:** clean retention {m['clean_retention']:.3f}; experiments avoided {m['experiments_avoided']:.3f}; bad caught {m['bad_candidates_caught']}; random-enrichment p {m['matched_random_one_sided_hypergeom_p']:.4f}")
          PY
          fi

      - name: Upload RGV-P34 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rgv-p34-report
          path: rgv-p34-report.json
          if-no-files-found: error
