name: cpg001-jain-mirror-replication

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpg001-jain-mirror-replication.yml'
      - 'benchmarks/candidate_promotion/JAIN_2017_MIRROR_REPLICATION_CONTRACT.json'
      - 'benchmarks/candidate_promotion/run_jain_mirror_replication.py'
      - 'tests/test_candidate_promotion_jain_mirror.py'

permissions:
  contents: read

jobs:
  mirror-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIRROR_COMMIT: 4ad3ec59ff1f6ddb886ca0cf2a9d47b1ba0f136a
      MIRROR_BLOB: 15235ba7afc16cd9564c34078fbc1670e7383d09
      MIRROR_BYTES: '42777'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -U pip
      - run: python -m pip install "setuptools==82.0.1" "wheel==0.47.0" pytest
      - run: python -m pip install --no-build-isolation .
      - name: Verify mirror harness locally before network use
        run: pytest -q tests/test_candidate_promotion_jain_mirror.py
      - name: Acquire pinned public transcription as Git object
        shell: bash
        run: |
          set -euo pipefail
          mirror_root="$RUNNER_TEMP/hogroast-teaching"
          git init "$mirror_root"
          git -C "$mirror_root" remote add origin https://github.com/HPuntu/hogroast-teaching.git
          git -C "$mirror_root" fetch --depth=1 origin "$MIRROR_COMMIT"
          test "$(git -C "$mirror_root" rev-parse FETCH_HEAD)" = "$MIRROR_COMMIT"
          git -C "$mirror_root" show "$MIRROR_COMMIT:jain_data.csv" > /tmp/jain_data.csv
          test "$(wc -c < /tmp/jain_data.csv | tr -d ' ')" = "$MIRROR_BYTES"
          test "$(git hash-object /tmp/jain_data.csv)" = "$MIRROR_BLOB"
          sha256sum /tmp/jain_data.csv
      - name: Run frozen primary analysis on pinned mirror
        run: |
          mkdir -p /tmp/cpg001-jain-mirror
          python benchmarks/candidate_promotion/run_jain_mirror_replication.py \
            --csv /tmp/jain_data.csv \
            --out /tmp/cpg001-jain-mirror/JAIN_2017_MIRROR_REPLICATION_REPORT.json
      - name: Emit mirror replication summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('/tmp/cpg001-jain-mirror/JAIN_2017_MIRROR_REPLICATION_REPORT.json'))
          p=r['analysis']['primary_verdict']
          print('## CPG-001 mirror replication')
          print('')
          print(f"**Evidence tier:** `{r['evidence_tier']}`")
          print(f"**Scientific signal:** `{r['scientific_signal']}`")
          print(f"**Complete-case candidates:** {r['analysis']['complete_case_candidate_count']}/137")
          print(f"**Folds with ≥10pp liability reduction:** {p['folds_with_ge_10pp_reduction']}/4")
          print(f"**Pooled fill rate:** {p['pooled_fill_rate']}")
          print(f"**Held-out control flag rate:** {p['pooled_control_heldout_flag_rate']}")
          print(f"**Held-out treatment flag rate:** {p['pooled_treatment_heldout_flag_rate']}")
          print('')
          print('This is a pinned-mirror replication signal, not the canonical publisher-byte confirmation.')
          PY
      - name: Upload mirror replication evidence
        uses: actions/upload-artifact@v6
        with:
          name: cpg001-jain-mirror-replication-${{ github.run_id }}
          path: /tmp/cpg001-jain-mirror
          retention-days: 90
