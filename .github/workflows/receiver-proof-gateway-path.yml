name: receiver-proof-gateway-path
on:
  push:
    branches: [fix/receiver-proof-gateway-path-001]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: python3 -m pip install cryptography grpcio protobuf
      - name: Check atomic signed receipt
        run: python3 -m unittest gateway/poppy/test_atomic_receipt.py -v
      - name: Exercise real Envoy gateway and Wallet
        run: |
          docker pull envoyproxy/envoy:v1.39.3
          docker create --name envoy-binary-extract envoyproxy/envoy:v1.39.3
          docker cp envoy-binary-extract:/usr/local/bin/envoy /tmp/openline-envoy
          docker rm envoy-binary-extract
          chmod +x /tmp/openline-envoy
          /tmp/openline-envoy --version
          ENVOY_BIN=/tmp/openline-envoy NO_PROXY=localhost,127.0.0.1 python3 gateway/poppy/test_gateway_path.py
