name: WALLET-STANDING-001 Wallet Boundary

on:
  push:
    paths:
      - ".github/workflows/wallet-standing-001.yml"
      - "experiments/wallet-standing-001/**"
      - "WALLET_STANDING_001_HANDOFF.json"
  pull_request:
    paths:
      - ".github/workflows/wallet-standing-001.yml"
      - "experiments/wallet-standing-001/**"
      - "WALLET_STANDING_001_HANDOFF.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-wallet-standing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Receipt Gate
        run: python -m pip install -e .
      - name: Run focused tests
        run: python -m unittest discover -s experiments/wallet-standing-001/tests -v
      - name: Reproduce frozen result
        run: |
          cp experiments/wallet-standing-001/frozen_result.json /tmp/wallet-standing-001.json
          python experiments/wallet-standing-001/scripts/run_frozen.py
          cmp /tmp/wallet-standing-001.json experiments/wallet-standing-001/frozen_result.json
      - name: Verify release surface
        run: python experiments/wallet-standing-001/scripts/verify_release.py
      - name: Upload frozen receipt
        uses: actions/upload-artifact@v4
        with:
          name: wallet-standing-001-frozen-result
          path: experiments/wallet-standing-001/frozen_result.json
          if-no-files-found: error
