name: TERRYNCE-EARLY-WARNING-001 Calibration Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: TERRYNCE-EARLY-WARNING-001
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit and boundary tests
        run: python -m unittest discover -s tests -v

      - name: Acquire exact Zenodo v2 bundle
        run: python -m terrynce_early_warning.cli acquire | tee artifacts/acquire_calibration_stdout.json

      - name: Re-enforce data preflight
        run: python -m terrynce_early_warning.cli preflight | tee artifacts/preflight_calibration_stdout.json

      - name: Re-enforce science lock
        run: python -m terrynce_early_warning.cli science-lock-diagnostic | tee artifacts/science_lock_calibration_stdout.json

      - name: Re-enforce episode lock
        run: python -m terrynce_early_warning.cli episode-lock | tee artifacts/episode_lock_calibration_stdout.json

      - name: Fit training models, consume validation once, freeze holdout predictions
        run: python -m terrynce_early_warning.cli calibrate | tee artifacts/calibration_stdout.json

      - name: Enforce unopened holdout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/calibration_report.json").read_text())
          lock=json.loads(Path("artifacts/calibration.lock.json").read_text())
          assert r["status"]=="PASS_CALIBRATION_LOCK"
          assert r["holdout_labels_constructed"] is False
          assert lock["holdout_labels_constructed"] is False
          assert lock["final_verdict"]=="WITHHELD_PENDING_UNTOUCHED_HOLDOUT"
          assert lock["holdout_features_match_episode_lock"] is True
          print(json.dumps({
              "status": r["status"],
              "counts": r["counts"],
              "best_single_feature": r["best_single_feature"],
              "validation_metrics": r["validation_metrics"],
              "validation_incremental_brier": r["validation_incremental_brier"],
              "calibration_lock_sha256": r["calibration_lock_sha256"],
              "holdout_predictions_sha256": r["holdout_predictions_sha256"],
              "next_gate": r["next_gate"],
          }, indent=2))
          PY

      - name: Upload frozen calibration receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TERRYNCE-EARLY-WARNING-001-calibration-lock
          path: |
            TERRYNCE-EARLY-WARNING-001/artifacts/*.json
            TERRYNCE-EARLY-WARNING-001/artifacts/*.sha256
            TERRYNCE-EARLY-WARNING-001/artifacts/episode_lock_train_validation.csv
            TERRYNCE-EARLY-WARNING-001/artifacts/holdout_predictions.lock.csv
          if-no-files-found: error
          retention-days: 30
