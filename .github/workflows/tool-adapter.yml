name: tool-adapter

on:
  pull_request:
    paths:
      - 'olp_gate/tool_adapter.py'
      - 'olp_gate/__init__.py'
      - 'tests/test_tool_adapter.py'
      - 'tests/test_tool_adapter_runtime.py'
      - 'examples/langgraph_refund_guard/**'
      - 'docs/TOOL_ADAPTER.md'
      - '.github/workflows/tool-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'olp_gate/tool_adapter.py'
      - 'olp_gate/__init__.py'
      - 'tests/test_tool_adapter.py'
      - 'tests/test_tool_adapter_runtime.py'
      - 'examples/langgraph_refund_guard/**'
      - 'docs/TOOL_ADAPTER.md'
      - '.github/workflows/tool-adapter.yml'

permissions:
  contents: read

jobs:
  guarded-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -U pip
      - run: python -m pip install "setuptools==82.0.1" "wheel==0.47.0"
      - run: python -m pip install --no-build-isolation .
      - name: Guarded-tool unit tests
        run: python -m unittest tests.test_tool_adapter -v
      - name: Real Authority Compiler + Verified Commit runtime
        run: python -m unittest tests.test_tool_adapter_runtime -v
      - name: Existing Authority Compiler regression
        run: python -m unittest tests.test_authority_compiler -v
      - name: Five-minute refund demo
        run: |
          rm -rf examples/langgraph_refund_guard/.openline-demo
          python examples/langgraph_refund_guard/demo.py | tee /tmp/refund-demo.txt
          grep -q 'OPENLINE BLOCKED: QUARANTINE' /tmp/refund-demo.txt
          grep -q "'status': 'refunded'" /tmp/refund-demo.txt
          grep -q 'payment_limit_exceeded' /tmp/refund-demo.txt
