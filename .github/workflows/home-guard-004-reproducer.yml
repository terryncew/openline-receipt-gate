name: HOME-GUARD-004 reproducer with operational costs
# Disposable kernel experiment + cost measurements. Runs ONLY on this branch.
# Never merge. No real networks, no production credentials, $0.
on:
  push:
    branches: [study/home-guard-004-reproducer-costs]
permissions:
  contents: read
jobs:
  measured:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile experiments/home-guard-003/*.py
      - name: Prepare test-only dependencies
        run: |
          set -eu
          python -m pip install cryptography==50.0.1
          if ! command -v ip >/dev/null || ! command -v iptables >/dev/null || ! command -v tcpdump >/dev/null || ! command -v conntrack >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends iproute2 iptables conntrack tcpdump
          fi
          command -v ip && command -v iptables && command -v tcpdump && command -v conntrack
      - name: Verify frozen PR #113 mechanism unchanged
        run: |
          set -eu
          # The security mechanism files must be byte-identical to the frozen candidate.
          git diff 44486057320e908ec091c327112d830f65e20caa --stat -- experiments/home-guard-003/policy_gate.py experiments/home-guard-003/verify_evidence.py experiments/home-guard-003/make_policies.py experiments/home-guard-003/run_virtual_network.sh experiments/home-guard-003/active_flow.py experiments/home-guard-003/echo_endpoint.py
          echo "--- mechanism diff above (expect only run_measured.sh + measure_phases.py as new files, no modifications) ---"
          git diff 44486057320e908ec091c327112d830f65e20caa --name-only -- experiments/home-guard-003/
      - name: Execute measured disposable run
        run: |
          bash experiments/home-guard-003/run_measured.sh "$RUNNER_TEMP/home-guard-004-evidence"
      - name: Hostile evidence-tampering test (must be rejected)
        run: |
          set -eu
          E="$RUNNER_TEMP/home-guard-004-evidence"
          T="$RUNNER_TEMP/home-guard-004-tampered"
          cp -a "$E" "$T"
          # Tamper: flip one byte in the first signed receipt
          python3 - "$T/apply-receipts.jsonl" <<'EOF'
          import sys
          p = sys.argv[1]
          lines = open(p).read().splitlines()
          # Corrupt the signature field of the first receipt
          import json
          r = json.loads(lines[0])
          sig = r["signature"]["signature"]
          r["signature"]["signature"] = ("0" if sig[0] != "0" else "1") + sig[1:]
          lines[0] = json.dumps(r, sort_keys=True)
          open(p, "w").write("\n".join(lines) + "\n")
          print("tampered first receipt signature")
          EOF
          set +e
          python3 experiments/home-guard-003/verify_evidence.py "$T" > "$T/tamper-test.log" 2>&1
          rc=$?
          set -e
          echo "tampered-evidence verifier exit code: $rc"
          tail -3 "$T/tamper-test.log"
          if [ "$rc" -eq 0 ]; then
            echo "FALSIFIER: verifier ACCEPTED tampered evidence" >&2
            exit 1
          fi
          echo "TAMPER_TEST_PASS: verifier rejected tampered evidence (exit $rc)"
          cp "$T/tamper-test.log" "$E/tamper-test.log"
      - name: Preserve evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOME-GUARD-004-measured-evidence
          path: ${{ runner.temp }}/home-guard-004-evidence
          if-no-files-found: error
          retention-days: 30
