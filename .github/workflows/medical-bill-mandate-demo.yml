name: Medical Bill Mandate Demo

on:
  pull_request:
    paths:
      - "demos/medical-bill-mandate-demo/**"
      - ".github/workflows/medical-bill-mandate-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run medical bill mandate demo
        run: python demos/medical-bill-mandate-demo/scripts/run_demo.py
      - uses: actions/upload-artifact@v6
        with:
          name: medical-bill-mandate-demo-evidence
          path: |
            demos/medical-bill-mandate-demo/demo_receipt.json
            demos/medical-bill-mandate-demo/pressure_qa.json
          if-no-files-found: error
