name: WALLET-STANDING-004 Live Transport

on:
  push:
    paths:
      - ".github/workflows/wallet-standing-004.yml"
      - "experiments/wallet-standing-004/**"
      - "WALLET_STANDING_004_HANDOFF.json"
  pull_request:
    paths:
      - ".github/workflows/wallet-standing-004.yml"
      - "experiments/wallet-standing-004/**"
      - "WALLET_STANDING_004_HANDOFF.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Receipt Gate
        run: python -m pip install -e .
      - name: Run WALLET-004 focused tests
        run: python -m unittest discover -s experiments/wallet-standing-004/tests -v
      - name: Verify frozen release and dependency pins
        run: python experiments/wallet-standing-004/scripts/verify_release.py
      - name: Run live transport experiment
        run: python experiments/wallet-standing-004/scripts/run_live.py
      - name: Verify live result
        run: python experiments/wallet-standing-004/scripts/verify_live.py
      - name: Run existing regression suite
        run: python -m unittest discover -s tests -v
      - name: Upload live receipt
        uses: actions/upload-artifact@v4
        with:
          name: wallet-standing-004-live-result
          path: experiments/wallet-standing-004/live_result.json
          if-no-files-found: error
