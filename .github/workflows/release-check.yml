name: release-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HALF_LIFE_COMMIT: 70121b53e86196d69b2c3457174b38ad32667b43
      X402_UPSTREAM_COMMIT: 167a828e8319aa7b403f4f4312489e9cffadff10

    steps:
      - name: Check out Receipt Gate
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned build prerequisites
        run: python -m pip install "setuptools==82.0.1" "wheel==0.47.0"

      - name: Install Receipt Gate
        run: python -m pip install --no-build-isolation .

      - name: Install pinned Half-Life fixture
        shell: bash
        run: |
          set -euo pipefail
          half_life_root="$RUNNER_TEMP/openline-half-life"
          git init "$half_life_root"
          git -C "$half_life_root" remote add origin https://github.com/terryncew/openline-half-life.git
          git -C "$half_life_root" fetch --depth=1 origin "$HALF_LIFE_COMMIT"
          git -C "$half_life_root" checkout --detach FETCH_HEAD
          test "$(git -C "$half_life_root" rev-parse HEAD)" = "$HALF_LIFE_COMMIT"
          python -m pip install "$half_life_root"
          printf 'OLP_HALF_LIFE_ROOT=%s\n' "$half_life_root" >> "$GITHUB_ENV"
          printf 'OLP_HALF_LIFE_SOURCE_ROOT=%s\n' "$half_life_root" >> "$GITHUB_ENV"

      - name: Verify vendored Half-Life release fixture
        run: python scripts/verify_vendored_half_life.py

      - name: Install pinned official x402 source fixture
        shell: bash
        run: |
          set -euo pipefail
          x402_root="$RUNNER_TEMP/x402-upstream"
          git init "$x402_root"
          git -C "$x402_root" remote add origin https://github.com/x402-foundation/x402.git
          git -C "$x402_root" fetch --depth=1 origin "$X402_UPSTREAM_COMMIT"
          git -C "$x402_root" checkout --detach FETCH_HEAD
          test "$(git -C "$x402_root" rev-parse HEAD)" = "$X402_UPSTREAM_COMMIT"
          python -m pip install "$x402_root/python/x402"
          printf 'OLP_X402_UPSTREAM_ROOT=%s\n' "$x402_root" >> "$GITHUB_ENV"

      - name: Compile Python sources
        run: python -m compileall -q olp_gate benchmarks examples scripts tests

      - name: Verify frozen benchmark source closure
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            benchmarks/warning_time/results/control/decision_receipts.jsonl \
            benchmarks/warning_time/results/dropped_counterevidence/decision_receipts.jsonl \
            benchmarks/warning_time/results/unflagged_contradiction/decision_receipts.jsonl \
            benchmarks/verified_continuation/results/continuation_report.json \
            benchmarks/x402_upstream_consequence/SOURCE.json \
            benchmarks/x402_upstream_consequence/results/comparison.json \
            benchmarks/x402_upstream_consequence/results/effects/native-failed-settlement.log \
            benchmarks/x402_upstream_consequence/results/effects/native-success.log \
            benchmarks/x402_upstream_consequence/results/effects/airlock-success.log
          do
            git ls-files --error-unmatch -- "$artifact" >/dev/null
            if git check-ignore --no-index --quiet -- "$artifact"; then
              printf 'ignored frozen artifact: %s\n' "$artifact" >&2
              exit 1
            fi
          done
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          for freeze_name in (
              "benchmarks/x402_airlock/FREEZE.json",
              "benchmarks/verified_continuation/FREEZE.json",
              "benchmarks/role_confusion_consequence/FREEZE.json",
          ):
              freeze_path = Path(freeze_name)
              freeze = json.loads(freeze_path.read_text(encoding="utf-8"))
              for artifact in [freeze_path.as_posix(), *sorted(freeze["files"])]:
                  subprocess.run(
                      ["git", "ls-files", "--error-unmatch", "--", artifact],
                      check=True,
                  )
                  ignored = subprocess.run(
                      ["git", "check-ignore", "--no-index", "--quiet", "--", artifact],
                      check=False,
                  )
                  if ignored.returncode == 0:
                      raise SystemExit(f"ignored frozen artifact: {artifact}")
          PY

      - name: Verify frozen warning-time archive integrity
        run: python scripts/verify_warning_time_release.py

      - name: Verify frozen x402 Transaction Airlock
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/x402_airlock/run_hostile_suite.py
          git diff --exit-code -- benchmarks/x402_airlock/results/hostile_report.json
          python scripts/verify_x402_airlock.py

      - name: Reproduce pinned upstream x402 consequence order
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/x402_upstream_consequence/run_comparison.py \
            --upstream-root "$OLP_X402_UPSTREAM_ROOT"
          git diff --exit-code -- benchmarks/x402_upstream_consequence/results
          python scripts/verify_x402_upstream_consequence.py \
            --upstream-root "$OLP_X402_UPSTREAM_ROOT"

      - name: Verify frozen Role-Confusion Consequence Gate
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/role_confusion_consequence/run_suite.py
          git diff --exit-code -- benchmarks/role_confusion_consequence/results/hostile_report.json
          python scripts/verify_role_confusion_consequence.py

      - name: Verify frozen Verified Continuation harness
        run: python scripts/verify_verified_continuation.py

      - name: Run complete release gate
        run: python scripts/release_check.py

      - name: Verify generated manifest independently
        run: python scripts/verify_manifest.py
