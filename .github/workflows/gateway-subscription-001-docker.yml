# GATEWAY-SUBSCRIPTION-001 Step 1: verify the Docker Compose gateway path
# FOR REAL on a GitHub Actions ubuntu-latest runner (has Docker; the
# build VM does not).
#
# What it does:
#   1. Checks out branch experiment/gateway-subscription-001.
#   2. `docker compose --profile openline up --build -d` (AUTH_MODE=openline).
#   3. Waits for Envoy on 127.0.0.1:8080.
#   4. Runs gateway/ci/docker_verify.py: provisions an agent, sends
#      signed transfers through Envoy, and asserts the HTTP path
#      (200 / tampered-403 / replay-403), ACTUAL ledger deltas
#      (+/- exactly 100 cents), receipt verification, persistence
#      across mockapi restart, revocation, and full-stack restart.
#   5. Uploads container logs + verifier output as artifacts.
#   6. `docker compose down` (always).
#
# Trigger: workflow_dispatch only. No secrets, no paid APIs, no real
# payment processing — the ledger is fully simulated.

name: gateway-subscription-001-docker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: experiment/gateway-subscription-001

      - name: Build and start the gateway stack
        working-directory: gateway/compose
        env:
          AUTH_MODE: openline
        run: |
          docker compose --profile openline up --build -d
          docker compose --profile openline ps

      - name: Wait for Envoy health
        run: |
          for i in $(seq 1 36); do
            if curl -sf -m 3 http://127.0.0.1:8080/health; then
              echo; echo "envoy healthy after ~$((i * 5))s"
              break
            fi
            sleep 5
          done
          curl -sf -m 5 http://127.0.0.1:8080/health

      - name: Install verifier dependencies
        run: python3 -m pip install --break-system-packages -q cryptography grpcio protobuf

      - name: Run Docker verification
        run: |
          set -o pipefail
          mkdir -p /tmp/gwlogs
          python3 gateway/ci/docker_verify.py 2>&1 | tee /tmp/gwlogs/verify-output.log

      - name: Capture container logs
        if: always()
        working-directory: gateway/compose
        run: |
          mkdir -p /tmp/gwlogs
          docker compose --profile openline logs --no-color > /tmp/gwlogs/compose.log 2>&1 || true
          docker compose --profile openline ps >> /tmp/gwlogs/compose.log 2>&1 || true
          echo "--- log sizes ---"
          wc -c /tmp/gwlogs/*

      - name: Upload logs and verifier output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-docker-logs
          path: /tmp/gwlogs/
          retention-days: 14

      - name: Tear down the stack
        if: always()
        working-directory: gateway/compose
        run: docker compose --profile openline down
